name: Build Android APKs (all variants)

# Android-only CI. The desktop jobs in rpcs3.yml (Linux/Mac/Windows/FreeBSD) are
# upstream RPCS3's and already gate themselves off on this fork for push events
# (github.repository == 'RPCS3/rpcs3'); this workflow is the one that actually
# runs here.
#
# Builds all four release variants from android/build-variants.sh (legacy/a11/a13/a15).
# a13 (API 33, sdk33) is split into its own job with no dependencies so it starts
# immediately and uploads as soon as it's done. legacy/a11/a15 run afterward, as a matrix,
# gated on `needs: build-a13` -- that's what actually guarantees a13 finishes first, rather
# than just hoping three same-cost parallel builds happen to race in our favor.

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'rpcs3/**'
      - '3rdparty/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'rpcs3/**'
      - '3rdparty/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-a13:
    name: Android APK (a13 / sdk33)
    uses: ./.github/workflows/android-apk-variant.yml
    with:
      variant: a13
      android_api: 33
      arm_march: armv8.2-a+dotprod+fp16
      variant_suffix: a13-armv8.2-sdk33

  build-other-variants:
    name: Android APK (${{ matrix.variant }})
    needs: build-a13
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: legacy
            android_api: 30
            arm_march: armv8.1-a
            variant_suffix: legacy-armv8.1-sdk30
          - variant: a11
            android_api: 30
            arm_march: armv8.2-a+dotprod+fp16
            variant_suffix: a11-armv8.2-sdk30
          - variant: a15
            android_api: 35
            arm_march: armv8.2-a+dotprod+fp16
            variant_suffix: a15-armv8.2-sdk35
    uses: ./.github/workflows/android-apk-variant.yml
    with:
      variant: ${{ matrix.variant }}
      android_api: ${{ matrix.android_api }}
      arm_march: ${{ matrix.arm_march }}
      variant_suffix: ${{ matrix.variant_suffix }}
